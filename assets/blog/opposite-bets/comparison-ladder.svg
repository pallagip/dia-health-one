<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 618" width="520" height="618" role="img" aria-labelledby="cl-title cl-desc" font-family="Manrope, Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="cl-title">Conceptual diagram: a comparison ladder that stops when a difference falls inside its uncertainty</title>
  <desc id="cl-desc">A conceptual illustration only. The positions and bars are drawn for explanation; they are not measurements, predictions or an executed screen. Three stacked rungs, read top to bottom. Rung zero compares two broadly separated, assay-appropriate settings whose uncertainty bars do not overlap, so the verdict is to refine. Rung one compares a narrower pair that is still separated, so the verdict is to step in only if that step could change a decision. Rung two compares a very narrow pair whose uncertainty bars overlap, so the verdict is to stop and record the interval. A closing note states that categorical choices, such as two different attachment sites, are matched comparisons rather than numeric ladders.</desc>
  <rect width="520" height="618" fill="#f7f6f2"/>

  <text x="16" y="26" font-family="DM Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#6f56b5" letter-spacing="1.2">CONCEPTUAL — NOT DATA</text>
  <text x="16" y="58" font-size="24" font-weight="700" fill="#202027">Broad contrast first, then refine.</text>

  <!-- rung 0 -->
  <g>
    <rect x="16" y="78" width="488" height="140" rx="15" fill="#ffffff" stroke="#deddd7"/>
    <text x="36" y="106" font-family="DM Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#6f56b5" letter-spacing="1.2">RUNG 0 · BROAD, ASSAY-FIT</text>
    <text x="86" y="138" font-size="16" fill="#72717b" text-anchor="middle">Setting A</text>
    <text x="434" y="138" font-size="16" fill="#72717b" text-anchor="middle">Setting B</text>
    <line x1="36" y1="160" x2="484" y2="160" stroke="#deddd7" stroke-width="2"/>
    <g stroke="#46337d" stroke-width="3" stroke-linecap="round">
      <line x1="58" y1="160" x2="114" y2="160"/>
      <line x1="58" y1="152" x2="58" y2="168"/>
      <line x1="114" y1="152" x2="114" y2="168"/>
      <line x1="406" y1="160" x2="462" y2="160"/>
      <line x1="406" y1="152" x2="406" y2="168"/>
      <line x1="462" y1="152" x2="462" y2="168"/>
    </g>
    <circle cx="86" cy="160" r="8" fill="#6f56b5"/>
    <circle cx="434" cy="160" r="8" fill="#6f56b5"/>
    <circle cx="42" cy="190" r="6" fill="#6f56b5"/>
    <text x="58" y="196" font-size="18" font-weight="650" fill="#202027">Clear of uncertainty — refine.</text>
  </g>

  <!-- rung 1 -->
  <g>
    <rect x="16" y="234" width="488" height="140" rx="15" fill="#ffffff" stroke="#deddd7"/>
    <text x="36" y="262" font-family="DM Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#6f56b5" letter-spacing="1.2">RUNG 1 · NARROWER, STILL REAL</text>
    <text x="180" y="294" font-size="16" fill="#72717b" text-anchor="middle">Setting A</text>
    <text x="340" y="294" font-size="16" fill="#72717b" text-anchor="middle">Setting B</text>
    <line x1="36" y1="316" x2="484" y2="316" stroke="#deddd7" stroke-width="2"/>
    <g stroke="#46337d" stroke-width="3" stroke-linecap="round">
      <line x1="152" y1="316" x2="208" y2="316"/>
      <line x1="152" y1="308" x2="152" y2="324"/>
      <line x1="208" y1="308" x2="208" y2="324"/>
      <line x1="312" y1="316" x2="368" y2="316"/>
      <line x1="312" y1="308" x2="312" y2="324"/>
      <line x1="368" y1="308" x2="368" y2="324"/>
    </g>
    <circle cx="180" cy="316" r="8" fill="#6f56b5"/>
    <circle cx="340" cy="316" r="8" fill="#6f56b5"/>
    <circle cx="42" cy="346" r="6" fill="#6f56b5"/>
    <text x="58" y="352" font-size="18" font-weight="650" fill="#202027">Still apart — step in to decide.</text>
  </g>

  <!-- rung 2 -->
  <g>
    <rect x="16" y="390" width="488" height="140" rx="15" fill="#25222d"/>
    <text x="36" y="418" font-family="DM Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#c8e5a8" letter-spacing="1.2">RUNG 2 · INSIDE THE UNCERTAINTY</text>
    <text x="150" y="442" font-size="16" fill="#d1ced8" text-anchor="middle">Setting A</text>
    <text x="370" y="442" font-size="16" fill="#d1ced8" text-anchor="middle">Setting B</text>
    <g stroke="#6d6878" stroke-width="1.5">
      <path d="M150 450 L150 457 L232 457" fill="none"/>
      <path d="M370 450 L370 457 L288 457" fill="none"/>
    </g>
    <line x1="36" y1="477" x2="484" y2="477" stroke="#4a4654" stroke-width="2"/>
    <g stroke="#c8e5a8" stroke-width="3" stroke-linecap="round">
      <line x1="200" y1="470" x2="264" y2="470"/>
      <line x1="200" y1="464" x2="200" y2="476"/>
      <line x1="264" y1="464" x2="264" y2="476"/>
      <line x1="256" y1="484" x2="320" y2="484"/>
      <line x1="256" y1="478" x2="256" y2="490"/>
      <line x1="320" y1="478" x2="320" y2="490"/>
    </g>
    <circle cx="232" cy="470" r="8" fill="#ffffff"/>
    <circle cx="288" cy="484" r="8" fill="#ffffff"/>
    <circle cx="42" cy="502" r="6" fill="#c8e5a8"/>
    <text x="58" y="508" font-size="18" font-weight="650" fill="#ffffff">Bars overlap — stop, record.</text>
  </g>

  <!-- footer note -->
  <g>
    <rect x="16" y="546" width="488" height="58" rx="14" fill="#fcf7e8" stroke="#e2d7ad"/>
    <text x="36" y="572" font-size="17" fill="#5e5848">Categorical choices, like two attachment sites,</text>
    <text x="36" y="594" font-size="17" fill="#5e5848">are matched comparisons, not numeric ladders.</text>
  </g>
</svg>
