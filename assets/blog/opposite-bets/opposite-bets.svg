<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Compare competing research hypotheses</title>
  <desc id="desc">A schematic shows two opposing hypotheses compared under matched conditions, then recorded with uncertainty.</desc>
  <rect width="1200" height="627" fill="#f8f8f5"/>
  <circle cx="1015" cy="115" r="210" fill="#e8e1f5" opacity=".8"/>
  <circle cx="160" cy="540" r="180" fill="#c8e5a8" opacity=".45"/>
  <text x="72" y="78" fill="#7155bd" font-family="monospace" font-size="19" letter-spacing="3">DIA HEALTH ONE  /  PROPOSED METHOD</text>
  <text x="72" y="145" fill="#201f27" font-family="Arial, sans-serif" font-size="47" font-weight="700">Compare both predictions.</text>
  <rect x="72" y="202" width="360" height="155" rx="22" fill="#ffffff" stroke="#deddd7" stroke-width="2"/>
  <rect x="768" y="202" width="360" height="155" rx="22" fill="#ffffff" stroke="#deddd7" stroke-width="2"/>
  <text x="106" y="249" fill="#7155bd" font-family="monospace" font-size="17" letter-spacing="2">HYPOTHESIS A</text>
  <text x="106" y="298" fill="#201f27" font-family="Arial, sans-serif" font-size="28" font-weight="700">One explanation</text>
  <text x="802" y="249" fill="#7155bd" font-family="monospace" font-size="17" letter-spacing="2">HYPOTHESIS B</text>
  <text x="802" y="298" fill="#201f27" font-family="Arial, sans-serif" font-size="28" font-weight="700">The alternative</text>
  <path d="M450 278h112" stroke="#7155bd" stroke-width="5" stroke-linecap="round"/>
  <path d="m548 262 20 16-20 16" fill="none" stroke="#7155bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M750 278H638" stroke="#7155bd" stroke-width="5" stroke-linecap="round"/>
  <path d="m652 262-20 16 20 16" fill="none" stroke="#7155bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="292" y="405" width="616" height="112" rx="20" fill="#25222d"/>
  <text x="600" y="451" fill="#c8e5a8" font-family="monospace" font-size="17" letter-spacing="2" text-anchor="middle">MATCHED COMPARISON</text>
  <text x="600" y="488" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Record result, limits and uncertainty</text>
  <text x="72" y="577" fill="#686671" font-family="Arial, sans-serif" font-size="17">Schematic only. No molecule, candidate, screen or result is shown.</text>
</svg>
