name: Deploy website to Cloudflare

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare public website
        run: |
          test -s index.html
          mkdir _site
          cp index.html _site/index.html
          for directory in assets images; do
            if [ -d "$directory" ]; then cp -R "$directory" "_site/$directory"; fi
          done
          for file in favicon.ico robots.txt sitemap.xml; do
            if [ -f "$file" ]; then cp "$file" "_site/$file"; fi
          done
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 009bb104fa671722398b10841f018688
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.86.0 pages deploy _site \
            --project-name dia-health-one \
            --branch "$DEPLOY_BRANCH" \
            --commit-hash "$GITHUB_SHA" | tee deployment.log
          deployment_url=$(sed -n 's/.*Deployment complete! Take a peek over at \(https:\/\/[a-z0-9]*\.dia-health-one\.pages\.dev\).*/\1/p' deployment.log | tail -1)
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Website deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed website
        if: github.event_name != 'pull_request'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$DEPLOYMENT_URL/" -o deployed.html && cmp _site/index.html deployed.html; then
              echo 'HTTPS readback matches the committed website.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          exit 1
