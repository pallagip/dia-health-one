name: Audit compiled GluHUT systems

on:
  push:
    branches:
      - analysis/gluhut-compiled-system-audit
    paths:
      - "research/audit_gluhut_compiled_systems.py"
      - "tests/test_audit_gluhut_compiled_systems.py"
      - ".github/workflows/gluhut-compiled-system-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gluhut-compiled-system-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_MD5: 9f3c6733dc608d2bd37c488c560a5443
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser and comparison tests
        run: python -m unittest tests/test_audit_gluhut_compiled_systems.py -v

      - name: Acquire and verify public SMD archive
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'DiaHealthOne-Reproducibility/1.0' \
            --output /tmp/SMD_trajectories.zip \
            'https://zenodo.org/api/records/19664426/files/SMD_trajectories.zip/content'
          echo "$ARCHIVE_MD5  /tmp/SMD_trajectories.zip" | md5sum --check --strict

      - name: Audit compiled topologies and restart files
        run: |
          python research/audit_gluhut_compiled_systems.py \
            --archive /tmp/SMD_trajectories.zip \
            --output-json research/data/gluhut-compiled-system-audit.json \
            | tee /tmp/compiled-system-summary.json

      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research/data/gluhut-compiled-system-audit.json').read_text())
          assert data['archive']['md5'] == '9f3c6733dc608d2bd37c488c560a5443'
          assert data['archive']['crc_verified'] is True
          assert data['topology_count'] == 4
          assert data['decision']['candidate_ranking_authorized'] is False
          assert data['decision']['pag_parameterization_authorized'] is False
          assert data['decision']['mcq1_parameter_transfer_authorized'] is False
          assert data['decision']['source_resp_gaff_glycam_generation_reconstructable'] is False
          assert 'not NNC2215' in data['not_target_claim']
          print(json.dumps({
              'host_comparison': data['host_comparison'],
              'guest_and_system_summary': data['guest_and_system_summary'],
              'restart_matches': data['restart_matches'],
              'decision': data['decision'],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit audit result to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data/gluhut-compiled-system-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'Record compiled GluHUT system audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Compiled GluHUT system audit'
            echo
            if [ -f /tmp/compiled-system-summary.json ]; then
              echo '```json'
              cat /tmp/compiled-system-summary.json
              echo '```'
            else
              echo 'No compiled-system summary was generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
