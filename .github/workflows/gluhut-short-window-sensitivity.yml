name: Audit GluHUT short-window sensitivity

on:
  push:
    branches:
      - analysis/gluhut-short-window-sensitivity
    paths:
      - "research/audit_gluhut_short_window_sensitivity.py"
      - "tests/test_audit_gluhut_short_window_sensitivity.py"
      - ".github/workflows/gluhut-short-window-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gluhut-short-window-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WHAM_COMMIT: 43bdd6fcd1916ae2b169cb52ac326b7eea567abb
      ARCHIVE_MD5: dbc6723b8adcb85deb8230f63b6a51da
      ARCHIVE_SHA256: e0e7b7c04326b8fe86cf71e2193315f34fb865168cf11117b3caf9253119c6eb
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.2.6

      - name: Run sensitivity-tool tests
        run: python -m unittest tests/test_audit_gluhut_short_window_sensitivity.py -v

      - name: Acquire and verify public Zenodo archive
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'DiaHealthOne-Reproducibility/1.0' \
            --output /tmp/WHAM_PMF.zip \
            'https://zenodo.org/api/records/19664426/files/WHAM_PMF.zip/content'
          echo "$ARCHIVE_MD5  /tmp/WHAM_PMF.zip" | md5sum --check --strict
          echo "$ARCHIVE_SHA256  /tmp/WHAM_PMF.zip" | sha256sum --check --strict

      - name: Build pinned Grossfield WHAM
        run: |
          git clone --quiet https://github.com/agrossfield/wham /tmp/grossfield-wham
          git -C /tmp/grossfield-wham checkout --quiet "$WHAM_COMMIT"
          make -C /tmp/grossfield-wham/wham

      - name: Run short-window and analysis sensitivity
        run: |
          python research/audit_gluhut_short_window_sensitivity.py \
            --archive /tmp/WHAM_PMF.zip \
            --wham-binary /tmp/grossfield-wham/wham/wham \
            --output-json research/data/gluhut-fructofuranose-us2-sensitivity.json | tee /tmp/sensitivity-summary.txt

      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research/data/gluhut-fructofuranose-us2-sensitivity.json').read_text())
          assert data['short_window']['frame_count'] == 205
          assert data['decision']['candidate_ranking_authorized'] is False
          assert 'not NNC2215' in data['not_target_claim']
          print(json.dumps(data['decision'], indent=2, sort_keys=True))
          PY

      - name: Commit sensitivity result to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data/gluhut-fructofuranose-us2-sensitivity.json
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git commit -m 'Record GluHUT short-window sensitivity analysis'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## GluHUT short-window sensitivity'
            echo
            if [ -f /tmp/sensitivity-summary.txt ]; then
              echo '```json'
              cat /tmp/sensitivity-summary.txt
              echo '```'
            else
              echo 'No sensitivity summary was generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
