name: Map GluHUT SMD restraint atoms

on:
  push:
    branches:
      - main
      - analysis/gluhut-smd-restraint-mapping
    paths:
      - "research/audit_gluhut_smd_restraints.py"
      - "tests/test_audit_gluhut_smd_restraints.py"
      - ".github/workflows/gluhut-smd-restraint-mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gluhut-smd-restraint-mapping-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_MD5: 9f3c6733dc608d2bd37c488c560a5443
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest tests/test_audit_gluhut_smd_restraints.py -v

      - name: Acquire and verify public SMD archive
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'DiaHealthOne-Reproducibility/1.0' \
            --output /tmp/SMD_trajectories.zip \
            'https://zenodo.org/api/records/19664426/files/SMD_trajectories.zip/content'
          echo "$ARCHIVE_MD5  /tmp/SMD_trajectories.zip" | md5sum --check --strict

      - name: Map restraint groups to compiled atoms
        run: |
          python research/audit_gluhut_smd_restraints.py \
            --archive /tmp/SMD_trajectories.zip \
            --output-json research/data/gluhut-smd-restraint-mapping.json \
            | tee /tmp/restraint-mapping-summary.json

      - name: Validate bounded conclusions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('research/data/gluhut-smd-restraint-mapping.json').read_text())
          summary = data['cross_system_summary']
          decision = data['decision']
          assert data['archive']['md5'] == '9f3c6733dc608d2bd37c488c560a5443'
          assert data['archive']['crc_verified'] is True
          assert len(data['restraint_files']) == 3
          assert summary['mapping_count'] == 4
          assert summary['host_group_index_set_identical'] is True
          assert summary['host_group_mapped_identity_identical'] is True
          assert summary['host_group_all_carbon'] is True
          assert summary['host_group_all_MOL_residue'] is True
          assert summary['guest_groups_exclude_host_residue'] is True
          assert summary['guest_groups_heavy_atoms_only'] is True
          assert decision['group1_is_same_12_host_carbons_across_all_systems'] is True
          assert decision['group2_is_guest_only_heavy_atom_selection'] is True
          assert decision['force_constant_convention_validated'] is False
          assert decision['candidate_ranking_authorized'] is False
          assert decision['pag_parameterization_authorized'] is False
          assert decision['mcq1_parameter_transfer_authorized'] is False
          print(json.dumps({
              'summary': summary,
              'decision': decision,
              'mappings': data['mappings'],
          }, indent=2, sort_keys=True))
          PY

      - name: Commit audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data/gluhut-smd-restraint-mapping.json
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
            exit 0
          fi
          git commit -m 'Record GluHUT SMD restraint mapping'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## GluHUT SMD restraint mapping'
            echo
            if [ -f /tmp/restraint-mapping-summary.json ]; then
              echo '```json'
              cat /tmp/restraint-mapping-summary.json
              echo '```'
            else
              echo 'No mapping summary was generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
