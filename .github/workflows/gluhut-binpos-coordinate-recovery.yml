name: Recover GluHUT BINPOS coordinates

on:
  push:
    branches:
      - main
      - analysis/gluhut-binpos-coordinate-recovery
    paths:
      - "research/audit_gluhut_binpos_coordinates.py"
      - "tests/test_audit_gluhut_binpos_coordinates.py"
      - ".github/workflows/gluhut-binpos-coordinate-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gluhut-binpos-coordinate-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_MD5: 9f3c6733dc608d2bd37c488c560a5443
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest tests/test_audit_gluhut_binpos_coordinates.py -v

      - name: Acquire and verify public SMD archive
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent 'DiaHealthOne-Reproducibility/1.0' \
            --output /tmp/SMD_trajectories.zip \
            'https://zenodo.org/api/records/19664426/files/SMD_trajectories.zip/content'
          echo "$ARCHIVE_MD5  /tmp/SMD_trajectories.zip" | md5sum --check --strict

      - name: Recover and audit recorded coordinate frames
        run: |
          python research/audit_gluhut_binpos_coordinates.py \
            --archive /tmp/SMD_trajectories.zip \
            --output-json research/data/gluhut-binpos-coordinate-recovery.json \
            | tee /tmp/binpos-coordinate-summary.json

      - name: Validate bounded conclusions
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(
              Path('research/data/gluhut-binpos-coordinate-recovery.json').read_text()
          )
          decision = data['decision']
          assert data['archive']['md5'] == '9f3c6733dc608d2bd37c488c560a5443'
          assert data['archive']['crc_verified'] is True
          assert data['trajectory_count'] == 20
          assert data['total_recorded_frames'] > 0
          assert len(data['system_summaries']) == 4
          assert {row['system_name'] for row in data['system_summaries']} == {
              'glucose', 'galactose', 'fructopyranose', 'fructofuranose'
          }
          assert sum(row['trajectory_count'] for row in data['system_summaries']) == 20
          assert sum(row['total_recorded_frames'] for row in data['system_summaries']) == data['total_recorded_frames']

          assert decision['all_binpos_headers_and_record_sizes_valid'] is True
          assert decision['all_files_little_endian'] is True
          assert decision['recorded_coordinate_frames_recoverable'] is True
          assert decision['recorded_first_and_last_frames_hashed'] is True
          assert decision['original_pretrajectory_start_coordinates_recovered'] is False
          assert decision['recorded_frames_can_support_coordinate_level_provenance_audit'] is True
          assert decision['recorded_frames_can_replace_missing_source_restart'] is False
          assert decision['new_smd_or_umbrella_generation_authorized'] is False
          assert decision['parent_pag_calibration_authorized'] is False
          assert decision['mcq1_parameter_transfer_authorized'] is False
          assert decision['candidate_ranking_authorized'] is False

          for row in data['trajectories']:
              assert row['layout']['natom'] == 183
              assert row['layout']['frame_count'] >= 1
              assert len(row['first_frame']['coordinate_bytes_sha256']) == 64
              assert len(row['last_frame']['coordinate_bytes_sha256']) == 64
              rc = row['reaction_coordinate']
              for key in ('minimum_A', 'maximum_A', 'first_A', 'last_A', 'mean_A', 'rmse_from_linear_0_to_15A_schedule_A'):
                  assert math.isfinite(rc[key]), (row['path'], key, rc[key])
              assert rc['maximum_A'] >= rc['minimum_A']
              assert rc['minimum_frame_index_zero_based'] >= 0
              assert rc['maximum_frame_index_zero_based'] >= 0
              assert len(rc['distance_series_sha256']) == 64

          print(json.dumps({
              'trajectory_count': data['trajectory_count'],
              'total_recorded_frames': data['total_recorded_frames'],
              'system_summaries': data['system_summaries'],
              'decision': decision,
          }, indent=2, sort_keys=True))
          PY

      - name: Commit coordinate audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/data/gluhut-binpos-coordinate-recovery.json
          if git diff --cached --quiet; then
            echo 'No coordinate-audit changes to commit.'
            exit 0
          fi
          git commit -m 'Record GluHUT BINPOS coordinate recovery'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## GluHUT BINPOS coordinate recovery'
            echo
            if [ -f /tmp/binpos-coordinate-summary.json ]; then
              echo '```json'
              cat /tmp/binpos-coordinate-summary.json
              echo '```'
            else
              echo 'No coordinate summary was generated.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
