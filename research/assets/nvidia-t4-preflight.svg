<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">OpenMM OpenCL benchmark throughput on an NVIDIA GPU</title>
<desc id="desc">Three 100-picosecond timed runs on Tesla T4 using a generic solvated 1UBQ system with 17,764 atoms. Median throughput 270.2 nanoseconds per day. This is not an NNC2215 or PaG simulation.</desc>
